<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>读书笔记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Source+Han+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg: #faf8f5;
  --card: #ffffff;
  --text: #3a3632;
  --text-light: #8a847c;
  --accent: #6b5b4f;
  --accent-soft: #a89a8c;
  --border: #ece7e1;
  --tag: #f3efe9;
  --shadow: 0 4px 20px rgba(107, 91, 79, 0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.75;
  padding: 24px 16px;
}

.container { max-width: 1080px; margin: 0 auto; }

header {
  text-align: center;
  padding: 48px 20px 36px;
  margin-bottom: 32px;
  border-bottom: 1px solid var(--border);
}

header h1 {
  font-weight: 500;
  font-size: 32px;
  letter-spacing: 4px;
  color: #2e2a26;
}

header p {
  color: var(--text-light);
  margin-top: 10px;
  font-size: 14px;
  letter-spacing: 2px;
}

.toolbar {
  display: flex;
  gap: 12px;
  margin-bottom: 28px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
}

.search-box, .filter-select, .btn {
  padding: 11px 18px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  background: white;
  color: var(--text);
  font-family: inherit;
}

.search-box { min-width: 220px; }

.btn {
  background: var(--accent);
  color: #faf8f5;
  border: none;
  cursor: pointer;
  letter-spacing: 1px;
  transition: background 0.2s;
}

.btn:hover { background: #5a4b41; }

.btn-secondary {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent-soft);
}

.stats {
  text-align: center;
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 28px;
  letter-spacing: 1px;
}

.stats span { color: var(--text); font-weight: 500; }

.notes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 28px;
}

.note-card {
  background: var(--card);
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  transition: transform 0.25s ease;
}

.note-card:hover { transform: translateY(-3px); }

.cover-wrapper {
  height: 200px;
  background: #f4f0eb;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.cover-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.cover-placeholder {
  color: var(--accent-soft);
  font-size: 36px;
  letter-spacing: 4px;
}

.card-body { padding: 20px 22px 18px; }

.category {
  display: inline-block;
  color: var(--accent);
  font-size: 12px;
  letter-spacing: 1px;
  border-bottom: 1px solid var(--accent-soft);
  padding-bottom: 2px;
  margin-bottom: 12px;
}

.note-card h3 {
  font-size: 17px;
  font-weight: 500;
  margin-bottom: 8px;
  line-height: 1.5;
  letter-spacing: 0.5px;
}

.note-meta {
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 14px;
  letter-spacing: 0.5px;
}

.note-preview {
  font-size: 14px;
  color: #4a4642;
  line-height: 1.8;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 16px;
}

.note-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--text-light);
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.note-actions button {
  background: none;
  border: none;
  color: var(--accent);
  cursor: pointer;
  font-size: 12px;
  margin-left: 10px;
  font-family: inherit;
  letter-spacing: 1px;
}

.note-actions button:hover { text-decoration: underline; }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(58, 54, 50, 0.35);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-overlay.active { display: flex; }

.modal {
  background: #fefdfb;
  border-radius: 6px;
  width: 100%;
  max-width: 640px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 32px 28px;
  border: 1px solid var(--border);
}

.modal h2 {
  font-size: 20px;
  font-weight: 500;
  margin-bottom: 22px;
  letter-spacing: 2px;
  text-align: center;
}

.form-group { margin-bottom: 16px; }

.form-group label {
  display: block;
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 6px;
  letter-spacing: 1px;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 14px;
  font-family: inherit;
  background: white;
}

.form-group textarea { min-height: 150px; resize: vertical; line-height: 1.8; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.cover-upload {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin-top: 8px;
}

.cover-preview {
  width: 80px;
  height: 110px;
  background: #f4f0eb;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 1px solid var(--border);
  flex-shrink: 0;
}

.cover-preview img { width: 100%; height: 100%; object-fit: cover; }

.modal-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 24px;
}

.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-light);
  letter-spacing: 1px;
}

@media (max-width: 640px) {
  .form-row { grid-template-columns: 1fr; }
  .notes-grid { grid-template-columns: 1fr; }
  header h1 { font-size: 26px; letter-spacing: 2px; }
}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>读书笔记</h1>
    <p>记录阅读 · 留下痕迹</p>
  </header>

  <div class="toolbar">
    <input type="text" class="search-box" id="searchInput" placeholder="搜索书名或笔记">
    <select class="filter-select" id="categoryFilter">
      <option value="">全部分类</option>
    </select>
    <button class="btn" onclick="openModal()">新增笔记</button>
    <button class="btn btn-secondary" onclick="exportAllAsImage()">导出合集</button>
  </div>

  <div class="stats" id="stats"></div>
  <div class="notes-grid" id="notesGrid"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">新增读书笔记</h2>
    <form id="noteForm">
      <input type="hidden" id="noteId">
      <div class="form-group">
        <label>书名</label>
        <input type="text" id="title" required placeholder="书名">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>作者</label>
          <input type="text" id="author" placeholder="作者">
        </div>
        <div class="form-group">
          <label>出版社</label>
          <input type="text" id="publisher" placeholder="出版社">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>分类</label>
          <input type="text" id="category" list="categoryList" placeholder="文学 / 随笔 / 哲学">
          <datalist id="categoryList"></datalist>
        </div>
        <div class="form-group">
          <label>阅读日期</label>
          <input type="date" id="readDate">
        </div>
      </div>
      <div class="form-group">
        <label>封面</label>
        <div class="cover-upload">
          <div class="cover-preview" id="coverPreview">
            <span style="font-size:12px;color:#b0a89e;">无封面</span>
          </div>
          <div style="flex:1;">
            <input type="file" id="coverFile" accept="image/*" style="font-size:13px;margin-bottom:8px;">
            <input type="text" id="coverUrl" placeholder="或粘贴图片链接">
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>笔记</label>
        <textarea id="notes" placeholder="写下你的思考与摘录..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button type="submit" class="btn">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="exportModal">
  <div class="modal" style="max-width:400px;text-align:center;">
    <h2>导出笔记</h2>
    <p style="color:var(--text-light);font-size:14px;margin-bottom:20px;">选择适合分享的格式</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <button class="btn" onclick="exportSingleAsImage()">导出图片</button>
      <button class="btn btn-secondary" onclick="exportSingleAsPDF()">导出 PDF</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeExportModal()">关闭</button>
    </div>
  </div>
</div>

<script>
const { jsPDF } = window.jspdf;
const STORAGE_KEY = 'reading_notes_literary';
let notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let editingId = null;
let currentExportNote = null;

const defaultCategories = ['文学', '随笔', '哲学', '历史', '艺术', '个人成长', '小说', '其他'];

function saveNotes() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  render();
}

function getCategories() {
  const cats = new Set(defaultCategories);
  notes.forEach(n => { if (n.category) cats.add(n.category); });
  return Array.from(cats);
}

function render() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const catFilter = document.getElementById('categoryFilter').value;

  let filtered = notes.filter(n => {
    const matchSearch = !search || 
      n.title.toLowerCase().includes(search) ||
      (n.author || '').toLowerCase().includes(search) ||
      (n.notes || '').toLowerCase().includes(search);
    const matchCat = !catFilter || n.category === catFilter;
    return matchSearch && matchCat;
  });

  filtered.sort((a, b) => (b.readDate || b.createdAt) > (a.readDate || a.createdAt) ? 1 : -1);

  const grid = document.getElementById('notesGrid');
  
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><p>尚无笔记</p><p style="margin-top:8px;font-size:13px;">点击「新增笔记」开始记录</p></div>`;
  } else {
    grid.innerHTML = filtered.map(n => `
      <div class="note-card">
        <div class="cover-wrapper">
          ${n.cover ? `<img src="${n.cover}" alt="">` : `<div class="cover-placeholder">书</div>`}
        </div>
        <div class="card-body">
          <div class="category">${n.category || '未分类'}</div>
          <h3>${escapeHtml(n.title)}</h3>
          <div class="note-meta">${n.author ? escapeHtml(n.author) : ''}${n.publisher ? ' · ' + escapeHtml(n.publisher) : ''}</div>
          <div class="note-preview">${escapeHtml(n.notes || '')}</div>
          <div class="note-footer">
            <span>${n.readDate || formatDate(n.createdAt)}</span>
            <div class="note-actions">
              <button onclick="exportNote('${n.id}')">导出</button>
              <button onclick="editNote('${n.id}')">编辑</button>
              <button onclick="deleteNote('${n.id}')">删除</button>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }

  document.getElementById('stats').innerHTML = `共 <span>${notes.length}</span> 本 · 当前 <span>${filtered.length}</span> 本`;
  updateCategoryFilter();
  updateDatalist();
}

function updateCategoryFilter() {
  const select = document.getElementById('categoryFilter');
  const current = select.value;
  const cats = getCategories();
  select.innerHTML = '<option value="">全部分类</option>' + 
    cats.map(c => `<option value="${c}" ${c === current ? 'selected' : ''}>${c}</option>`).join('');
}

function updateDatalist() {
  document.getElementById('categoryList').innerHTML = getCategories().map(c => `<option value="${c}">`).join('');
}

function openModal(note = null) {
  editingId = note ? note.id : null;
  document.getElementById('modalTitle').textContent = note ? '编辑笔记' : '新增读书笔记';
  document.getElementById('title').value = note ? note.title : '';
  document.getElementById('author').value = note ? note.author || '' : '';
  document.getElementById('publisher').value = note ? note.publisher || '' : '';
  document.getElementById('category').value = note ? note.category || '' : '';
  document.getElementById('readDate').value = note ? note.readDate || '' : new Date().toISOString().split('T')[0];
  document.getElementById('notes').value = note ? note.notes || '' : '';
  document.getElementById('coverUrl').value = '';
  document.getElementById('coverFile').value = '';
  
  const preview = document.getElementById('coverPreview');
  if (note && note.cover) {
    preview.innerHTML = `<img src="${note.cover}">`;
  } else {
    preview.innerHTML = `<span style="font-size:12px;color:#b0a89e;">无封面</span>`;
  }
  
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.getElementById('noteForm').reset();
  editingId = null;
}

function editNote(id) {
  const note = notes.find(n => n.id === id);
  if (note) openModal(note);
}

function deleteNote(id) {
  if (confirm('确定删除这条笔记吗？')) {
    notes = notes.filter(n => n.id !== id);
    saveNotes();
  }
}

document.getElementById('coverFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    document.getElementById('coverPreview').innerHTML = `<img src="${ev.target.result}">`;
    document.getElementById('coverUrl').value = '';
  };
  reader.readAsDataURL(file);
});

document.getElementById('coverUrl').addEventListener('input', function(e) {
  const url = e.target.value.trim();
  if (url) {
    document.getElementById('coverPreview').innerHTML = `<img src="${url}" onerror="this.parentElement.innerHTML='<span style=\\'font-size:12px;color:#b0a89e;\\'>加载失败</span>'">`;
  }
});

document.getElementById('noteForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  let cover = null;
  const fileInput = document.getElementById('coverFile');
  const urlInput = document.getElementById('coverUrl').value.trim();
  
  if (fileInput.files[0]) {
    cover = await readFileAsDataURL(fileInput.files[0]);
  } else if (urlInput) {
    cover = urlInput;
  } else if (editingId) {
    const old = notes.find(n => n.id === editingId);
    cover = old ? old.cover : null;
  }

  const data = {
    title: document.getElementById('title').value.trim(),
    author: document.getElementById('author').value.trim(),
    publisher: document.getElementById('publisher').value.trim(),
    category: document.getElementById('category').value.trim(),
    readDate: document.getElementById('readDate').value,
    notes: document.getElementById('notes').value.trim(),
    cover
  };

  if (editingId) {
    const idx = notes.findIndex(n => n.id === editingId);
    if (idx !== -1) notes[idx] = { ...notes[idx], ...data };
  } else {
    notes.push({
      id: Date.now().toString(),
      ...data,
      createdAt: new Date().toISOString()
    });
  }
  saveNotes();
  closeModal();
});

function readFileAsDataURL(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.readAsDataURL(file);
  });
}

function exportNote(id) {
  currentExportNote = notes.find(n => n.id === id);
  document.getElementById('exportModal').classList.add('active');
}

function closeExportModal() {
  document.getElementById('exportModal').classList.remove('active');
  currentExportNote = null;
}

async function exportSingleAsImage() {
  if (!currentExportNote) return;
  const card = createExportCard(currentExportNote);
  document.body.appendChild(card);
  const canvas = await html2canvas(card, { scale: 2, backgroundColor: '#faf8f5' });
  document.body.removeChild(card);
  
  const link = document.createElement('a');
  link.download = `${currentExportNote.title}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  closeExportModal();
}

async function exportSingleAsPDF() {
  if (!currentExportNote) return;
  const card = createExportCard(currentExportNote);
  document.body.appendChild(card);
  const canvas = await html2canvas(card, { scale: 2, backgroundColor: '#ffffff' });
  document.body.removeChild(card);

  const imgData = canvas.toDataURL('image/jpeg', 0.95);
  const pdf = new jsPDF('p', 'mm', 'a4');
  const pdfWidth = pdf.internal.pageSize.getWidth();
  const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
  pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, Math.min(pdfHeight, 280));
  pdf.save(`${currentExportNote.title}.pdf`);
  closeExportModal();
}

function createExportCard(note) {
  const div = document.createElement('div');
  div.style.cssText = 'width:420px;background:#fefdfb;padding:32px 28px;font-family:"Noto Serif SC",serif;position:absolute;left:-9999px;border:1px solid #ece7e1;';
  div.innerHTML = `
    ${note.cover ? `<img src="${note.cover}" style="width:100%;height:240px;object-fit:cover;margin-bottom:20px;">` : ''}
    <div style="font-size:12px;color:#6b5b4f;letter-spacing:2px;margin-bottom:12px;">${note.category || '读书笔记'}</div>
    <h2 style="font-size:22px;margin:0 0 8px;font-weight:500;letter-spacing:1px;">${escapeHtml(note.title)}</h2>
    <div style="color:#8a847c;font-size:13px;margin-bottom:18px;letter-spacing:0.5px;">${note.author || ''}${note.publisher ? ' · ' + note.publisher : ''}</div>
    <div style="font-size:14.5px;line-height:1.9;color:#3a3632;white-space:pre-wrap;">${escapeHtml(note.notes || '')}</div>
    <div style="margin-top:24px;font-size:12px;color:#a89a8c;text-align:right;letter-spacing:1px;">${note.readDate || ''}</div>
  `;
  return div;
}

async function exportAllAsImage() {
  if (notes.length === 0) return alert('暂无笔记');
  const container = document.createElement('div');
  container.style.cssText = 'width:760px;background:#faf8f5;padding:40px;position:absolute;left:-9999px;font-family:"Noto Serif SC",serif;';
  container.innerHTML = `<div style="text-align:center;margin-bottom:32px;"><h1 style="font-weight:500;letter-spacing:6px;font-size:28px;">读书笔记</h1><p style="color:#8a847c;letter-spacing:3px;margin-top:8px;font-size:13px;">记录阅读</p></div>` +
    notes.slice(0, 8).map(n => `
      <div style="background:#fff;padding:18px 20px;margin-bottom:16px;border:1px solid #ece7e1;display:flex;gap:16px;">
        ${n.cover ? `<img src="${n.cover}" style="width:70px;height:100px;object-fit:cover;">` : ''}
        <div style="flex:1;">
          <div style="font-weight:500;font-size:15px;letter-spacing:0.5px;">${escapeHtml(n.title)}</div>
          <div style="font-size:12px;color:#8a847c;margin:6px 0;">${n.author || ''} · ${n.category || ''}</div>
          <div style="font-size:13px;color:#4a4642;line-height:1.7;">${escapeHtml((n.notes || '').slice(0, 70))}${n.notes && n.notes.length > 70 ? '…' : ''}</div>
        </div>
      </div>
    `).join('');
  document.body.appendChild(container);
  const canvas = await html2canvas(container, { scale: 2 });
  document.body.removeChild(container);
  const link = document.createElement('a');
  link.download = '读书笔记合集.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('categoryFilter').addEventListener('change', render);
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id === 'modalOverlay') closeModal(); });
document.getElementById('exportModal').addEventListener('click', e => { if (e.target.id === 'exportModal') closeExportModal(); });

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text || '';
  return div.innerHTML;
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

render();
</script>
</body>
</html>
